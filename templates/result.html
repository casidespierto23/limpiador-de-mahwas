<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Bubble Cleaner - Resultado</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #eee;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 2.5rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
        }

        .comparison {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .image-box {
            text-align: center;
            flex: 1;
            min-width: 250px;
        }

        .image-box h4 {
            color: #888;
            margin-bottom: 0.5rem;
        }

        .image-box img {
            max-width: 100%;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            color: #000;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-size: 1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✅ ¡Procesado con éxito!</h1>
        </header>

        <main>
            <div class="card">
                <div class="comparison">
                    <div class="image-box">
                        <h4 style="color: #00d4ff;">📄 Original</h4>
                        <img src="{{ url_for('uploaded_file', filename=original) }}" alt="Original">
                    </div>
                    <div class="image-box">
                        <h4 style="color: #00ff88;">✨ Limpiado</h4>
                        <img src="{{ url_for('result_file', filename=cleaned) }}" alt="Limpio">
                    </div>
                </div>

                <div class="actions">
                    <a href="{{ url_for('result_file', filename=cleaned) }}" class="btn" download>
                        📥 Descargar imagen limpiada
                    </a>
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">
                        🔄 Procesar otra imagen
                    </a>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
