<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Bubble Cleaner - Resultado</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #eee;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(45deg, #00ff88, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #888;
            font-size: 1rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 2.5rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .comparison {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .image-box {
            text-align: center;
        }

        .image-box h4 {
            color: #888;
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        .image-box img {
            max-width: 100%;
            max-height: 500px;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
        }

        .image-box img:hover {
            transform: scale(1.02);
        }

        .actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            color: #000;
            font-weight: 700;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-size: 1rem;
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.6);
            background: linear-gradient(45deg, #00b8d4, #00e688);
        }

        .btn-download {
            background: linear-gradient(45deg, #00c853, #69f0ae);
            box-shadow: 0 6px 20px rgba(0, 200, 83, 0.4);
        }

        .btn-download:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 200, 83, 0.6);
            background: linear-gradient(45deg, #00b84d, #52c41a);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #00ff88;
        }

        .stat-label {
            color: #888;
            font-size: 0.8rem;
        }

        .success-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: linear-gradient(45deg, #00c853, #69f0ae);
            color: #000;
            border-radius: 20px;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✨ Resultado</h1>
            <p class="subtitle">Tu imagen ha sido limpiada exitosamente</p>
        </header>

        <main>
            <div class="card">
                <span class="success-badge">✓ Procesado con éxito</span>
                
                <div class="stats">
                    <div>
                        <div class="stat-value" id="imgWidth">--</div>
                        <div class="stat-label">Ancho</div>
                    </div>
                    <div>
                        <div class="stat-value" id="imgHeight">--</div>
                        <div class="stat-label">Alto</div>
                    </div>
                    <div>
                        <div class="stat-value" id="imgSize">--</div>
                        <div class="stat-label">Tamaño</div>
                    </div>
                </div>

                <div class="comparison">
                    <div class="image-box">
                        <h4 style="color: #00d4ff;">📄 Original</h4>
                        <img src="{{ url_for('uploaded_file', filename=original) }}" alt="Original" id="originalImg">
                    </div>
                    <div class="image-box">
                        <h4 style="color: #00ff88;">✨ Limpiado</h4>
                        <img src="{{ url_for('result_file', filename=cleaned) }}" alt="Limpio" id="cleanedImg">
                    </div>
                </div>

                <div class="actions">
                    <a href="{{ url_for('result_file', filename=cleaned) }}" class="btn btn-download" download>
                        📥 Descargar imagen limpiada
                    </a>
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">
                        🔄 Procesar otra imagen
                    </a>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Mostrar info de la imagen limpiada
        const cleanedImg = document.getElementById('cleanedImg');
        const originalImg = document.getElementById('originalImg');
        
        cleanedImg.onload = function() {
            document.getElementById('imgWidth').textContent = this.width + 'px';
            document.getElementById('imgHeight').textContent = this.height + 'px';
            
            const sizeKB = Math.round((this.naturalWidth * this.naturalHeight * 3) / 1024);
            document.getElementById('imgSize').textContent = sizeKB + 'KB';
        };
        
        originalImg.onload = function() {
            document.getElementById('imgWidth').textContent = this.width + 'px';
            document.getElementById('imgHeight').textContent = this.height + 'px';
        };
    </script>
</body>
</html>
